<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#006b3f">
  <title>KVB Chatbot | Riya</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="chat-container" aria-label="KVB assistant chat">
      <header class="chat-header">
        <div class="brand-mark" aria-hidden="true">KVB</div>
        <div class="header-copy">
          <h1>Riya</h1>
          <p><span class="status-dot"></span> Virtual Assistant</p>
        </div>
        <span class="header-badge">BANKING HELP</span>
      </header>

      <div class="chat-intro">
        <h2>How can I help you today?</h2>
        <p>Ask a question and I’ll do my best to help.</p>
      </div>

      <div class="chat-box" id="chat-box" role="log" aria-live="polite" aria-relevant="additions text">
        <article class="message assistant-message">
          <div class="avatar" aria-hidden="true">R</div>
          <div class="message-content">
            <div class="message-label">Riya <span>Assistant</span></div>
            <div class="message-bubble"><p>Welcome! How can I assist you today?</p></div>
          </div>
        </article>
      </div>

      <form class="composer" id="chat-form">
        <label class="sr-only" for="user-input">Your message</label>
        <textarea id="user-input" rows="1" maxlength="2000"
                  placeholder="Type your question..." autocomplete="off"></textarea>
        <button id="send-button" type="submit" aria-label="Send message">
          <span>Send</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-6-8-2Zm8 2 8-10"/></svg>
        </button>
      </form>
      <p class="privacy-note">Never share your PIN, password, OTP, or full account details.</p>
    </section>
  </main>
</body>
</html>
